<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">403 Unauthorized Access</title>
  <desc id="desc">An illustration of a locked security shield with the message 403 Unauthorized Access.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f4f7fb"/>
      <stop offset="100%" stop-color="#e7edf5"/>
    </linearGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff9f5a"/>
      <stop offset="100%" stop-color="#e8752f"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-opacity=".15"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" rx="28" fill="url(#bg)"/>

  <!-- Decorative dots -->
  <g fill="#cbd5e1">
    <circle cx="105" cy="105" r="5"/><circle cx="135" cy="105" r="3"/>
    <circle cx="665" cy="105" r="4"/><circle cx="695" cy="130" r="6"/>
    <circle cx="100" cy="470" r="4"/><circle cx="690" cy="455" r="5"/>
  </g>

  <!-- Ground shadow -->
  <ellipse cx="400" cy="505" rx="205" ry="24" fill="#263238" opacity=".10"/>

  <!-- Security shield -->
  <g filter="url(#shadow)">
    <path d="M400 105 L535 155 V270 C535 365 475 430 400 468 C325 430 265 365 265 270 V155 Z"
          fill="url(#shield)"/>
    <path d="M400 128 L510 169 V267 C510 344 462 397 400 432 C338 397 290 344 290 267 V169 Z"
          fill="#fff" opacity=".13"/>
  </g>

  <!-- Lock -->
  <g>
    <rect x="342" y="258" width="116" height="105" rx="18" fill="#263238"/>
    <path d="M365 258 V225 C365 205 380 190 400 190 C420 190 435 205 435 225 V258"
          fill="none" stroke="#263238" stroke-width="22" stroke-linecap="round"/>
    <circle cx="400" cy="303" r="13" fill="#fff"/>
    <rect x="395" y="307" width="10" height="28" rx="5" fill="#fff"/>
  </g>

  <!-- 403 badge -->
  <g transform="translate(78 350)">
    <rect width="170" height="86" rx="18" fill="#263238" filter="url(#shadow)"/>
    <text x="85" y="58" text-anchor="middle"
          font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="800"
          fill="#fff">403</text>
  </g>

  <!-- Small access-denied symbol -->
  <g transform="translate(560 365)">
    <circle cx="48" cy="48" r="43" fill="#fff" stroke="#263238" stroke-width="6"/>
    <path d="M24 72 L72 24" stroke="#e8752f" stroke-width="9" stroke-linecap="round"/>
  </g>

  <!-- Text -->
  <text x="400" y="525" text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="800"
        fill="#263238">Unauthorized Access</text>
  <text x="400" y="557" text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif" font-size="17"
        fill="#607080">You don't have permission to access this page.</text>
</svg>
